[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-analytics-lab"
version = "0.1.0"
description = "A synthetic-data margin analytics demonstration CLI."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
margin-report = "margin_analytics_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py311"
