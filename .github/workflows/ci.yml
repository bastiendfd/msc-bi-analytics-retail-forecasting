name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and checks
        run: python -m pip install . pytest ruff
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
